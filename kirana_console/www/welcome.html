<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Amol Vadgaon Enterprises</title>
	<link rel="manifest" href="/manifest.json" />
	<meta name="theme-color" content="#3E2417" />
	<link rel="apple-touch-icon" href="/assets/kirana_console/icons/icon-192.png" />
	<link rel="shortcut icon" href="/files/amol-vadgaon-logo.jpg" type="image/x-icon" />
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			background: #FAF6EF;
			color: #241710;
			text-align: center;
			padding: 32px 24px;
		}
		.logo {
			width: 92px;
			height: 92px;
			border-radius: 20px;
			object-fit: cover;
			box-shadow: 0 8px 24px -12px rgba(36,23,16,0.35);
			margin-bottom: 20px;
		}
		h1 {
			font-size: 24px;
			font-weight: 700;
			margin: 0 0 6px;
			color: #3E2417;
		}
		p.tagline {
			font-size: 15px;
			color: #6B5A4A;
			margin: 0 0 36px;
			max-width: 300px;
			line-height: 1.5;
		}
		.sign-in-btn {
			display: inline-block;
			background: #3E2417;
			color: #FAF6EF;
			text-decoration: none;
			font-size: 16px;
			font-weight: 600;
			padding: 14px 40px;
			border-radius: 10px;
			box-shadow: 0 4px 14px -4px rgba(62,36,23,0.4);
		}
		.sign-in-btn:active { opacity: 0.85; }
		.footer-note {
			margin-top: 28px;
			font-size: 13px;
			color: #9A8B7C;
		}
	</style>
</head>
<body>
	<img class="logo" src="/files/amol-vadgaon-logo.jpg" alt="Amol Vadgaon Enterprises" />
	<h1>Amol Vadgaon Enterprises</h1>
	<p class="tagline">Order groceries and daily supplies for your shop, straight from your phone.</p>
	<a class="sign-in-btn" href="/login">Sign In</a>
	<p class="footer-note">New here? Contact Amol to get your login details.</p>
</body>
</html>
